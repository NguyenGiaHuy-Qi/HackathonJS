<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <h1>Quản Lý Sinh Viên</h1>
        <div class="wrap">
          <form id="studentForm">
            <div class="form-group">
              <input type="text" name="fullName" placeholder="Họ và tên">
              <small class="error"></small>
            </div>
            <div class="form-group">
              <input type="text" name="studentId" placeholder="Mã số sinh viên">
              <small class="error"></small>
            </div>
            <div class="form-group">
              <input type="email" name="email" placeholder="Email">
              <small class="error"></small>
            </div>
            <div class="form-group">
              <input type="text" name="className" placeholder="Lớp">
              <small class="error"></small>
            </div>
            <button type="submit" class="btn-add">Thêm sinh viên</button>
          </form>
        </div>
        <div class="wrap student-list">
          <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên...">
          <table>
            <thead>
              <tr>
                <th>Họ tên</th>
                <th>MSSV</th>
                <th>Email</th>
                <th>Lớp</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
          </table>
        </div>
      </div>      
<script src="main.js"></script>
</body>
</html>
